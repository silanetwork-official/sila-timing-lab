#
# Self-test of the lab tooling on a GitHub-hosted runner. It measures
# nothing and never counts for S-8; it checks that the scripts parse and
# that the evidence check rejects every failed or incomplete result.
name: Lab self-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Script syntax
        run: |
          bash -n runner/register.sh scripts/check_evidence.sh scripts/test_check_evidence.sh
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ('runner/cloud-init-amd64.yaml', '.github/workflows/s8-timing.yml')]"
      - name: cloud-init embeds the current register.sh and no secret
        run: |
          python3 - <<'PY'
          import base64, yaml
          d = yaml.safe_load(open('runner/cloud-init-amd64.yaml'))
          emb = [f for f in d['write_files'] if f['path'] == '/opt/sila-s8/register.sh'][0]
          assert base64.b64decode(emb['content']) == open('runner/register.sh', 'rb').read(), 'stale embedded register.sh'
          text = open('runner/cloud-init-amd64.yaml').read().lower()
          assert 'token' not in yaml.dump([f for f in d['write_files'] if f['path'] != '/opt/sila-s8/register.sh']).lower()
          print('cloud-init ok')
          PY
      - name: Registered runner labels satisfy the timing job
        run: |
          # The job needs self-hosted + sila-s8 + the machine label; the
          # runner keeps its default labels (incl. self-hosted) and adds ours.
          grep -q 'runs-on: \[self-hosted, sila-s8, ' .github/workflows/s8-timing.yml
          # (no "! grep": a negated command never fails a "bash -e" step)
          if grep -q -- '--no-default-labels' runner/register.sh; then echo "::error::--no-default-labels drops self-hosted"; exit 1; fi
          grep -q -- '--labels "sila-s8,$label"' runner/register.sh
          echo "labels ok"
      - name: Timing workflow guards
        run: |
          w=.github/workflows/s8-timing.yml
          grep -q "github.ref == 'refs/heads/main'" $w              # main branch only
          grep -q "github.event_name == 'workflow_dispatch'" $w     # manual only
          if grep -nE '^\s+(push|pull_request|pull_request_target|schedule):' $w; then echo "::error::automatic trigger"; exit 1; fi
          if grep -nE '(checkout|fetch).*\|\| *true|\"\$GITHUB_SHA\" *\|\|' $w; then echo "::error::ignored checkout/fetch failure"; exit 1; fi
          grep -q '\[ "\$head" = "\$GITHUB_SHA" \]' $w            # exact dispatched commit
          grep -q 'SILA_COMMIT_EMAIL is not set; set it before starting' $w
          if grep -n 'pull .*--rebase' $w; then echo "::error::shallow rebase in the result step"; exit 1; fi
          grep -q 'git -C "$dest" config user.email "$COMMIT_EMAIL"' $w   # identity in the result clone
          if grep -rni 'private repository' $w runner README.md; then echo "::error::stale 'private' wording"; exit 1; fi
          echo "guards ok"
      - name: macOS bash >= 4.4 is ensured before registration
        run: |
          r=runner/register.sh; w=.github/workflows/s8-timing.yml
          for c in /opt/homebrew/bin/bash /usr/local/bin/bash /opt/local/bin/bash; do
            grep -q "$c" $r || { echo "::error::register.sh does not look for $c"; exit 1; }
            grep -q "$c" $w || { echo "::error::preflight does not look for $c"; exit 1; }
          done
          # The bash check comes before the token prompt (registration).
          [ "$(grep -n 'bash >= 4.4 is required' $r | cut -d: -f1)" -lt "$(grep -n 'Paste the runner registration token' $r | cut -d: -f1)" ]
          echo "macOS bash ok"
      - name: Evidence check accepts only complete passing runs
        run: bash scripts/test_check_evidence.sh
      - name: Autonomous x86-64 server (signed endpoint, cloud-init, preflight)
        run: |
          python3 -m pip install --quiet --user "cryptography==44.0.3"
          cd autonomous
          bash -n run.sh endpoint.sh
          python3 -m py_compile serve.py collect.py build_cloud_init.py
          # Signed, read-only endpoint: only fresh requests signed with the
          # collector key reach status, the file list or plain result files.
          python3 -I test_autonomous.py
          # cloud-init: built from this commit, no secret, SSH off, firewall 80/443 only.
          key=$(python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')
          python3 -I build_cloud_init.py "$key" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/ci.yaml"
          python3 - "$RUNNER_TEMP/ci.yaml" <<'PY'
          import base64, re, sys, yaml
          text = open(sys.argv[1]).read()
          d = yaml.safe_load(text)
          files = {f["path"]: f for f in d["write_files"]}
          for path, src in [("/opt/sila-s8/run.sh", "run.sh"), ("/opt/sila-s8/serve.py", "serve.py"),
                            ("/opt/sila-s8/endpoint.sh", "endpoint.sh"), ("/opt/sila-s8/check_evidence.sh", "../scripts/check_evidence.sh")]:
              assert base64.b64decode(files[path]["content"]) == open(src, "rb").read(), path
          plain = "\n".join(l for l in text.splitlines() if "encoding" not in l and not re.match(r"\s+content: [A-Za-z0-9+/=]{200,}$", l))
          assert not re.search(r"ghp_|github_pat_|ghs_|BEGIN [A-Z ]*PRIVATE KEY|SCW[A-Z0-9]{17}|X-Auth-Token", plain), "secret-like text"
          assert any("disable --now ssh.service ssh.socket" in c for c in d["runcmd"]), "SSH must be off"
          assert "tcp dport { 80, 443 } accept" in files["/etc/nftables.conf"]["content"], "firewall"
          assert "policy drop" in files["/etc/nftables.conf"]["content"], "default drop"
          assert "ConditionKernelCommandLine=isolcpus=2" in files["/etc/systemd/system/sila-s8-measure.service"]["content"]
          assert "127.0.0.1" in base64.b64decode(files["/opt/sila-s8/serve.py"]["content"]).decode()
          print("cloud-init ok")
          PY
      - name: Autonomous run rejects a virtual machine (this runner) and never counts it
        run: |
          t=$(mktemp -d); mkdir -p "$t/home"; cp scripts/check_evidence.sh "$t/home/"; echo "lab commit: selftest" > "$t/home/lab.txt"
          if sudo env SILA_S8_STATE="$t/state" SILA_S8_HOME="$t/home" bash autonomous/run.sh; then echo "::error::run.sh accepted a VM"; exit 1; fi
          grep -q 'PREFLIGHT FAILED: virtualization detected' "$t/state/out/machine.txt"
          sudo test -s "$t/state/out/SHA256SUMS"
          if bash scripts/check_evidence.sh "$t/state/out" amd64-baremetal full 75939d59602318e8eb3561b150cf0944035a03b5 >/dev/null 2>&1; then echo "::error::evidence accepted"; exit 1; fi
          echo "VM rejected, evidence not accepted"
